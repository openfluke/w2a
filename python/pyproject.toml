[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "welvet"
version = "1.1.2"
description = "Welvet Go AI engine v1.7.3 via Python C-ABI 1.1.2 — grids, layers, train, cuda/metal/rocm/vulkan"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{ name = "OpenFluke" }]
keywords = [
  "welvet",
  "ai",
  "neural-network",
  "cuda",
  "metal",
  "vulkan",
  "rocm",
  "ctypes",
  "cabi",
  "cameral",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/openfluke/welvet"
Documentation = "https://github.com/openfluke/w2a/tree/main/python"
Repository = "https://github.com/openfluke/w2a"
Changelog = "https://github.com/openfluke/w2a/releases"
"CABI binaries" = "https://github.com/openfluke/w2a/releases/tag/cabi-v1.1.2"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
welvet = [
  "linux_amd64/*",
  "linux_arm64/*",
  "macos_amd64/*",
  "macos_arm64/*",
  "windows_amd64/*",
  "windows_arm64/*",
  "android_arm64/*",
  "android_x86_64/*",
  "ios_arm64/*",
]
